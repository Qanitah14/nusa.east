<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artikel — Nusa East</title><link rel="icon" href="img/logo.png"><link rel="stylesheet" href="css/style.css"></head><body><main class="section"><div class="container"><span class="eyebrow">Insight Nusa East</span><h1>Artikel & Inspirasi</h1><p class="mt-16">Informasi dan inspirasi untuk mengembangkan brand lokal.</p><div id="articleList" class="grid-3 mt-40">Memuat artikel...</div></div></main><script>
(async()=>{const root=document.getElementById("articleList");try{const r=await fetch("https://nusa-east-vsxf.vercel.app/api/content/public/articles");if(!r.ok)throw new Error();const data=await r.json();root.textContent="";if(!data.length){root.textContent="Belum ada artikel yang diterbitkan.";return;}for(const a of data){const card=document.createElement("article");card.className="card";if(a.image){const img=document.createElement("img");img.src=/^https?:\/\//i.test(a.image)?a.image:"https://nusa-east-vsxf.vercel.app"+a.image;img.alt=a.title;img.style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px";card.append(img)}const h=document.createElement("h2");const link=document.createElement("a");link.href="artikel-detail.html?slug="+encodeURIComponent(a.slug);link.textContent=a.title;h.append(link);h.style.marginTop="16px";const p=document.createElement("p");p.textContent=(a.content||"").slice(0,180)+(a.content.length>180?"…":"");p.className="mt-8";const meta=document.createElement("small");meta.textContent=(a.author||"Nusa East")+" · "+new Date(a.created_at).toLocaleDateString("id-ID");card.append(h,p,meta);root.append(card);}}catch(e){root.textContent="Artikel belum dapat dimuat.";}})();
</script></body></html>
