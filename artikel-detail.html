
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artikel — Nusa East</title>
    <meta name="description" content="Baca artikel dan inspirasi dari Nusa East untuk mengembangkan brand lokal.">

    <link rel="icon" type="image/png" href="img/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/icons.js"></script>
</head>

<body>

    <!-- HEADER NUSA EAST -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>

    <script>
        renderHeader('articles');
    </script>


    <!-- ================= DETAIL ARTIKEL ================= -->

    <main class="section">

        <div class="container" style="max-width: 900px">

            <!-- Tombol kembali ke daftar artikel -->
            <a href="artikel.html">
                ← Semua Artikel
            </a>

            <article class="mt-40">

                <!-- Judul artikel -->
                <h1 id="title">
                    Memuat artikel...
                </h1>

                <!-- Nama penulis dan tanggal publikasi -->
                <p id="meta" class="mt-16"></p>

                <!-- Gambar artikel -->
                <img
                    id="image"
                    alt=""
                    style="
                        display: none;
                        width: 100%;
                        max-height: 460px;
                        object-fit: cover;
                        border-radius: 16px;
                        margin: 24px 0;
                    "
                >

                <!-- Isi artikel -->
                <div
                    id="content"
                    style="white-space: pre-wrap; line-height: 1.8"
                ></div>

            </article>

        </div>

    </main>


    <!-- ================= FOOTER NUSA EAST ================= -->

    <script>
        renderFooter();
    </script>


    <!-- ================= MENGAMBIL DATA ARTIKEL ================= -->

    <script>

        (async () => {

            // Mengambil slug dari URL
            const slug = new URLSearchParams(location.search).get("slug");

            if (!slug) {

                document.getElementById("title").textContent =
                    "Artikel tidak ditemukan";

                return;
            }

            try {

                // Mengambil data artikel berdasarkan slug
                const response = await fetch(
                    "https://nusa-east-vsxf.vercel.app/api/content/public/articles/"
                    + encodeURIComponent(slug)
                );

                if (!response.ok) {
                    throw new Error("Gagal mengambil artikel");
                }

                const article = await response.json();

                // Menampilkan judul artikel
                document.title = article.title + " — Nusa East";

                document.getElementById("title").textContent =
                    article.title;

                // Menampilkan nama penulis dan tanggal publikasi
                const author =
                    article.author && article.author.trim()
                        ? article.author
                        : "Nusa East";

                const date = article.created_at
                    ? new Date(article.created_at).toLocaleDateString("id-ID")
                    : "";

                document.getElementById("meta").textContent =
                    "Penulis: " + author + (date ? " · " + date : "");

                // Menampilkan isi artikel
                document.getElementById("content").textContent =
                    article.content || "";

                // Menampilkan gambar jika tersedia
                if (article.image) {

                    const image = document.getElementById("image");

                    image.src = /^https?:\/\//i.test(article.image)
                        ? article.image
                        : "https://nusa-east-vsxf.vercel.app" + article.image;

                    image.alt =
                        article.title || "Gambar artikel Nusa East";

                    image.style.display = "block";

                }

            } catch (error) {

                console.error("Gagal memuat artikel:", error);

                document.getElementById("title").textContent =
                    "Artikel tidak ditemukan";

                document.getElementById("content").textContent =
                    "Artikel tidak tersedia atau belum diterbitkan.";

            }

        })();

    </script>

</body>
</html>
