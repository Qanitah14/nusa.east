
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artikel — Nusa East</title>

    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="section">

        <div class="container" style="max-width: 900px">

            <!-- Tombol kembali ke daftar artikel -->
            <a href="artikel.html">
                ← Semua Artikel
            </a>

            <article class="mt-40">

                <!-- Judul artikel -->
                <h1 id="title">
                    Memuat artikel...
                </h1>

                <!-- Nama penulis dan tanggal publikasi -->
                <p id="meta" class="mt-16"></p>

                <!-- Gambar artikel -->
                <img
                    id="image"
                    alt=""
                    style="
                        display: none;
                        width: 100%;
                        max-height: 460px;
                        object-fit: cover;
                        border-radius: 16px;
                        margin: 24px 0;
                    "
                >

                <!-- Isi artikel -->
                <div
                    id="content"
                    style="white-space: pre-wrap; line-height: 1.8"
                ></div>

            </article>

        </div>

    </main>

    <!-- Mengambil data artikel dari API -->
    <script>

        (async () => {

            // Mengambil slug dari URL
            const slug = new URLSearchParams(location.search).get("slug");

            if (!slug) {

                document.getElementById("title").textContent =
                    "Artikel tidak ditemukan";

                return;
            }

            try {

                // Mengambil data artikel berdasarkan slug
                const r = await fetch(
                    "https://nusa-east-vsxf.vercel.app/api/content/public/articles/"
                    + encodeURIComponent(slug)
                );

                if (!r.ok) {
                    throw new Error("Gagal mengambil artikel");
                }

                const a = await r.json();

                // Menampilkan judul artikel
                document.title = a.title + " — Nusa East";

                document.getElementById("title").textContent =
                    a.title;

                // Menampilkan nama penulis dan tanggal publikasi
                document.getElementById("meta").textContent =
                    "Penulis: " +
                    (
                        a.author && a.author.trim()
                            ? a.author
                            : "Nusa East"
                    ) +
                    " · " +
                    new Date(a.created_at).toLocaleDateString("id-ID");

                // Menampilkan isi artikel
                document.getElementById("content").textContent =
                    a.content;

                // Menampilkan gambar jika tersedia
                if (a.image) {

                    const im = document.getElementById("image");

                    im.src = /^https?:\/\//i.test(a.image)
                        ? a.image
                        : "https://nusa-east-vsxf.vercel.app" + a.image;

                    im.alt = a.title || "Gambar artikel Nusa East";

                    im.style.display = "block";

                }

            } catch (e) {

                // Menampilkan pesan jika artikel gagal dimuat
                document.getElementById("title").textContent =
                    "Artikel tidak ditemukan";

                document.getElementById("content").textContent =
                    "Artikel tidak tersedia atau belum diterbitkan.";

            }

        })();

    </script>

</body>
</html>
