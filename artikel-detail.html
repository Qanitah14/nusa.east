
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artikel — Nusa East</title>

    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/icons.js"></script>
</head>

<body>

    <!-- Header -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>

    <script>
        renderHeader('articles');
    </script>


    <!-- Konten Detail Artikel -->
    <main class="section">

        <div class="container" style="max-width: 900px">

            <!-- Tombol kembali ke daftar artikel -->
            <a href="artikel.html">
                ← Semua Artikel
            </a>

            <article class="mt-40">

                <!-- Judul artikel -->
                <h1 id="title">
                    Memuat artikel...
                </h1>

                <!-- Nama penulis dan tanggal publikasi -->
                <p id="meta" class="mt-16"></p>

                <!-- Gambar utama artikel -->
                <img
                    id="image"
                    alt=""
                    style="
                        display: none;
                        width: 100%;
                        max-height: 460px;
                        object-fit: cover;
                        border-radius: 16px;
                        margin: 24px 0;
                    "
                >

                <!-- Isi artikel -->
                <div
                    id="content"
                    class="mt-24"
                    style="
                        line-height: 1.8;
                        overflow-wrap: anywhere;
                    "
                ></div>

            </article>

        </div>

    </main>


    <!-- Footer -->
    <script>
        renderFooter();
    </script>


    <!-- Mengambil data artikel dari API -->
    <script>

        (async () => {

            // Mengambil slug dari URL
            const slug = new URLSearchParams(
                location.search
            ).get("slug");

            if (!slug) {

                document.getElementById("title").textContent =
                    "Artikel tidak ditemukan";

                document.getElementById("content").textContent =
                    "Slug artikel tidak ditemukan.";

                return;
            }


            try {

                // Mengambil data artikel berdasarkan slug
                const r = await fetch(
                    "https://nusa-east-vsxf.vercel.app/api/content/public/articles/"
                    + encodeURIComponent(slug)
                );

                if (!r.ok) {
                    throw new Error("Gagal mengambil artikel");
                }

                const a = await r.json();


                // Menampilkan judul artikel
                document.title =
                    (a.title || "Artikel") + " — Nusa East";

                document.getElementById("title").textContent =
                    a.title || "Artikel";


                // Menampilkan nama penulis dan tanggal publikasi
                const author =
                    a.author && a.author.trim()
                        ? a.author
                        : "Nusa East";

                const date = a.created_at
                    ? new Date(a.created_at).toLocaleDateString("id-ID")
                    : "-";

                document.getElementById("meta").textContent =
                    "Penulis: " + author + " · " + date;


                // Menampilkan gambar utama artikel
                if (a.image) {

                    const im = document.getElementById("image");

                    im.src = /^https?:\/\//i.test(a.image)
                        ? a.image
                        : "https://nusa-east-vsxf.vercel.app" + a.image;

                    im.alt =
                        a.title || "Gambar artikel Nusa East";

                    im.style.display = "block";

                    im.onerror = function () {
                        this.style.display = "none";
                    };

                }


                // Menampilkan isi artikel
                // Mendukung format HTML dari editor:
                // bold, italic, underline, gambar, dan galeri.
                document.getElementById("content").innerHTML =
                    a.content || "";


            } catch (e) {

                console.error(
                    "Gagal memuat artikel:",
                    e
                );

                document.getElementById("title").textContent =
                    "Artikel tidak ditemukan";

                document.getElementById("content").textContent =
                    "Artikel tidak tersedia atau belum diterbitkan.";

            }

        })();

    </script>

</body>
</html>
