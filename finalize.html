<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalize Project — Nusa East</title>
<meta name="description" content="Nusa East membantu brand handmade, fashion, dan produk lokal membangun media sosial, konten visual, dan toko digital yang lebih profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="section">
  <div class="container">
    <div class="form-card text-center" style="max-width:600px; margin:0 auto;" id="finalizeBox"></div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/layout.js"></script>
<script>
  renderHeader('tracking');
  renderFooter();

  const params = new URLSearchParams(location.search);
  const orderId = params.get("order");
  const order = orderId ? getOrder(orderId) : null;
  const box = document.getElementById("finalizeBox");

  if (!order) {
    box.innerHTML = `<h2>Order tidak ditemukan</h2>`;
  } else {
    box.innerHTML = `
      <div style="font-size:3rem;">📦</div>
      <h2 class="mt-16">Project Siap Difinalisasi</h2>
      <p class="mt-8">Order ${order.id} — pastikan semua hasil sudah sesuai sebelum ditutup.</p>
      <div class="card mt-24" style="background:var(--color-cream-card); border:none; text-align:left;">
        <strong>File Hasil Akhir</strong>
        <p class="hint mt-8">📎 final-deliverables-${order.id}.zip (simulasi)</p>
      </div>
      <button class="btn btn-primary btn-block mt-24" id="finishBtn">Tandai Project Selesai</button>
    `;
    document.getElementById("finishBtn").addEventListener("click", () => {
      advanceOrder(order.id, "Project ditandai selesai oleh klien");
      location.href = "tracking.html?order=" + order.id;
    });
  }
</script>
</body>
</html>
