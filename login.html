<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — Nusa East</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-24">
      <div class="logo-mark" style="margin:0 auto 14px;">S</div>
      <h2>Masuk ke Akun Kamu</h2>
      <p class="mt-8">Masuk untuk melanjutkan proses pemesanan Nusa East.</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Masuk</button>
    </form>
    <div class="divider">atau</div>
    <button class="btn btn-outline btn-block" type="button" disabled>Masuk dengan Google (segera)</button>
    <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
  </div>
</div>

<script src="js/data.js"></script>

<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    await nusaeastLogin(data.email, data.password);
  });
</script>
</body>
</html>
