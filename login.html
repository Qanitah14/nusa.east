<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Masuk — Nusa east</title>
<meta name="description" content="Nusa East membantu brand handmade, fashion, dan produk lokal membangun media sosial, konten visual, dan toko digital yang lebih profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/icons.js"></script>
</head>
<body>

  
<div class="auth-wrap">
  <div class="auth-card">

    <div class="text-center mb-24">
      <img
        src="img/logo (2).png"
        alt="Nusa East"
        style="width:64px;height:64px;margin:0 auto 14px;object-fit:contain;"
        onerror="this.style.display='none'"
      >
      <h2>Masuk ke Akun Kamu</h2>
      <p class="mt-8">Wujudkan potensi brand kamu bersama Nusa East</p>
    </div>

    <div class="form-error" id="loginError" role="alert" hidden></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input
          type="email"
          class="form-control"
          id="loginEmail"
          name="email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input
          type="password"
          class="form-control"
          id="loginPassword"
          name="password"
          autocomplete="current-password"
          required
        >
      </div>

      <p class="auth-forgot" style="text-align:right;margin:-4px 0 14px;font-size:.88rem;">
        <a href="forgot-password.html">Lupa password?</a>
      </p>

      <button type="submit" class="btn btn-primary-login btn-block">
        Masuk
      </button>
    </form>

    <p class="auth-switch">
      Belum punya akun?
      <a href="register.html">Daftar sekarang</a>
    </p>

  </div>
</div>


<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    const errorBox = document.getElementById("loginError");
    const submit = e.target.querySelector('button[type="submit"]');
    errorBox.hidden = true; errorBox.textContent = "";
    submit.disabled = true; submit.textContent = "Memeriksa…";
    try { await nusaeastLogin(data.email, data.password); }
    catch (error) { errorBox.textContent = error.message || "Login gagal. Silakan coba lagi."; errorBox.hidden = false; }
    finally { submit.disabled = false; submit.textContent = "Masuk"; }
  });
</script>
</body>
</html>
