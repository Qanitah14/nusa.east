
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kebijakan Privasi — Nusa East</title>

    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/icons.js"></script>
</head>

<body>

    <!-- Header -->
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>

    <script>
        renderHeader('privacy');
    </script>

    <!-- Konten Kebijakan Privasi -->
    <main class="section">

        <div class="container" style="max-width: 900px">

            <!-- Tombol kembali -->
            <a href="index.html">
                ← Kembali ke Beranda
            </a>

            <!-- Label halaman -->
            <span
                class="eyebrow"
                style="display: block; margin-top: 24px"
            >
                Informasi
            </span>

            <!-- Judul halaman -->
            <h1 id="legalTitle">
                Kebijakan Privasi
            </h1>

            <!-- Gambar Kebijakan Privasi -->
            <div
                id="legalImageContainer"
                style="display: none; margin-top: 24px;"
            >
                <img
                    id="legalImage"
                    src=""
                    alt="Gambar Kebijakan Privasi Nusa East"
                    style="
                        width: 100%;
                        max-height: 420px;
                        object-fit: cover;
                        border-radius: 16px;
                    "
                >
            </div>

            <!-- Nama penulis -->
            <p
                id="legalAuthor"
                class="mt-16"
                style="color: #536273; font-size: .95rem"
            ></p>

            <!-- Tanggal pembaruan -->
            <p id="legalUpdated" class="mt-8"></p>

            <!-- Isi kebijakan privasi -->
            <div
                id="legalContent"
                class="mt-40"
                style="white-space: pre-wrap; line-height: 1.8"
            >
                Memuat konten...
            </div>

        </div>

    </main>

    <!-- Footer -->
    <script>
        renderFooter();
    </script>

    <!-- Mengambil data Kebijakan Privasi dari API -->
    <script>
        (async () => {

            try {

                // Mengambil data Kebijakan Privasi
                const r = await fetch(
                    "https://nusa-east-vsxf.vercel.app/api/content/public/legal/privacy"
                );

                if (!r.ok) {
                    throw new Error("Gagal mengambil data");
                }

                const d = await r.json();

                if (d) {

                    // Menampilkan judul
                    document.getElementById("legalTitle").textContent =
                        d.title || "Kebijakan Privasi";

                    // Menampilkan gambar Kebijakan Privasi
                    const imageContainer = document.getElementById("legalImageContainer");
                    const legalImage = document.getElementById("legalImage");

                    if (d.image) {
                        legalImage.src = /^https?:\/\//i.test(d.image)
                            ? d.image
                            : "https://nusa-east-vsxf.vercel.app" + d.image;

                        imageContainer.style.display = "block";
                    } else {
                        imageContainer.style.display = "none";
                    }

                    // Menampilkan isi konten
                    document.getElementById("legalContent").textContent =
                        d.content || "";

                    // Menampilkan nama penulis
                    document.getElementById("legalAuthor").textContent =
                        d.author && d.author.trim()
                            ? "Penulis: " + d.author
                            : "Penulis: Nusa East";

                    // Menampilkan tanggal pembaruan
                    document.getElementById("legalUpdated").textContent =
                        "Diperbarui: " +
                        (
                            d.updated_at
                                ? new Date(d.updated_at).toLocaleDateString("id-ID")
                                : "-"
                        );

                } else {

                    document.getElementById("legalContent").textContent =
                        "Konten belum tersedia.";

                }

            } catch (e) {

                // Menampilkan pesan jika API gagal
                document.getElementById("legalContent").textContent =
                    "Konten belum dapat dimuat. Silakan coba kembali.";

            }

        })();
    </script>

</body>
</html>
