<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Profil Operator — Operator Nusa East</title>
<link rel="icon" type="image/png" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/operator.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script defer src="../js/icons.js"></script>
</head>

<body class="admin-body operator-body">
<div class="admin-app" id="adminApp">
  <main class="admin-main">
    <div class="admin-content">

      <div class="a-page-head">
        <div>
          <span class="eyebrow">Akun</span>
          <h1 style="font-size:clamp(1.7rem,3.2vw,2.4rem);">
            Profil Operator
          </h1>
        </div>
      </div>

      <div class="a-profile-grid">

        <!-- Kartu identitas dan foto profil -->
        <aside class="a-card a-id-card">
          <div class="a-avatar lg" id="pAvatar" aria-hidden="true">A</div>

          <label class="profile-photo-upload" for="pPhotoInput">
            Ubah foto profil
          </label>

          <input
            type="file"
            id="pPhotoInput"
            accept="image/png,image/jpeg,image/webp"
            hidden
          >

          <button
            type="button"
            id="pPhotoRemove"
            class="hint"
            style="background:none;border:0;color:var(--color-danger);cursor:pointer;margin-top:4px;"
            hidden
          >
            Hapus foto
          </button>

          <p id="pPhotoMsg" class="hint" style="margin:6px 0 14px;">
            Maks. 1,5 MB
          </p>

          <h3 id="pName">Operator</h3>
          <p id="pEmail" class="hint">-</p>

          <span class="badge badge-green">
            <i class="fas fa-shield-halved"></i> Super User
          </span>

          <div class="a-kv-grid one" style="margin-top:22px;">
            <div class="a-kv">
              <span>Bergabung</span>
              <b id="pSince">-</b>
            </div>

            <div class="a-kv">
              <span>Sesi</span>
              <b>Berakhir saat tab ditutup / tidak aktif 30 menit</b>
            </div>
          </div>

          <div class="a-id-links">
            <a class="btn btn-outline btn-sm" href="activity.html">
              <i class="fas fa-clock-rotate-left"></i>
              Riwayat Aktivitas
            </a>

            <button class="btn btn-accent btn-sm" id="pLogout" type="button">
              <i class="fas fa-sign-out-alt"></i>
              Keluar
            </button>
          </div>
        </aside>

        <!-- Form informasi akun -->
        <div class="a-profile-forms">
          <section class="a-card">

            <div class="a-card-head">
              <h3>
                <i class="fas fa-user-circle"></i>
                Informasi Akun
              </h3>
            </div>

            <div class="form-error" id="infoErr" hidden></div>

            <form id="infoForm" novalidate>
              <div class="form-group">
                <label for="fName">Nama</label>
                <input
                  type="text"
                  id="fName"
                  class="form-control"
                  maxlength="150"
                  autocomplete="name"
                  required
                >
              </div>

              <div class="form-group">
                <label for="fEmail">Email</label>
                <input
                  type="email"
                  id="fEmail"
                  class="form-control"
                  disabled
                >
                <small class="hint">
                  Email dipakai untuk masuk dan tidak dapat diubah dari sini.
                </small>
              </div>

              <button
                type="submit"
                class="btn btn-primary btn-sm"
                id="infoBtn"
              >
                <i class="fas fa-save"></i>
                Simpan perubahan
              </button>
            </form>

          </section>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="../js/operator-config.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/operator.js"></script>
<script src="../js/staff-photo.js"></script>

<script>
if (Admin.init("profile")) {
  const $ = (id) => document.getElementById(id);

  const showErr = (id, message) => {
    const box = $(id);
    box.textContent = message || "";
    box.hidden = !message;
  };

  function paint(user) {
    if (!user) return;

    StaffPhoto.paintInitials(user.name);

    $("pName").textContent = user.name || "Operator";
    $("pEmail").textContent = user.email || "-";
    $("fName").value = user.name || "";
    $("fEmail").value = user.email || "";
  }

  // Tampilkan informasi operator
  paint(Admin.getUser());

  // Inisialisasi pengelolaan foto profil
  StaffPhoto.init();

  // Tombol keluar
  $("pLogout").addEventListener("click", () => Admin.logout());

  // Tanggal bergabung dari backend
  Admin.api.get("/auth/staff-me")
    .then((me) => {
      $("pSince").textContent = me.created_at
        ? Admin.dateID(me.created_at)
        : "-";
    })
    .catch(() => {
      $("pSince").textContent = "-";
    });

  // Simpan perubahan informasi akun
  $("infoForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    showErr("infoErr", "");

    const name = $("fName").value.trim();

    if (name.length < 2) {
      showErr("infoErr", "Nama minimal 2 karakter.");
      return;
    }

    const btn = $("infoBtn");
    btn.disabled = true;

    try {
      const out = await Admin.api.put("/auth/staff-profile", { name });

      const user = {
        ...Admin.getUser(),
        name: out.name
      };

      Admin.setUser(user);
      paint(user);

      Admin.toast("Profil berhasil disimpan.");
    } catch (err) {
      showErr("infoErr", err.message || "Gagal menyimpan profil.");
    } finally {
      btn.disabled = false;
    }
  });
}
</script>

</body>
</html>
