<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Data Pelanggan — Operator Nusa East</title>
<link rel="icon" type="image/png" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/operator.css">
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
<script defer src="../js/icons.js"></script>
</head>
<body class="admin-body operator-body">
<div class="admin-app" id="adminApp">
  <main class="admin-main">
    <div class="admin-content">
      <div class="a-page-head">
        <div>
          <span class="eyebrow">Pelanggan</span>
          <h1 style="font-size:clamp(1.7rem,3.2vw,2.4rem);">Data Pelanggan</h1>
          <p>Data lengkap pelanggan: kontak, alamat, riwayat pesanan, dan status login.</p>
        </div>
        
      </div>
      <div id="tbl"></div>
    </div>
  </main>
</div>
<script src="../js/operator-config.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/operator.js"></script>
<script>
if (Admin.init("customers")) {
  Op.table({ mount: "#tbl", endpoint: "/operator/customers", searchPlaceholder: "Cari nama, email, telepon, alamat…",
    filters: [{ name: "status", label: "Status akun", options: [["","Semua status akun"],["active","Aktif"],["disabled","Nonaktif"],["blocked","Diblokir"]] }, { name: "online", label: "Status login", options: [["","Online & offline"],["1","Hanya online"],["0","Hanya offline"]] }],
    columns: [
      { label: "Pelanggan", render: Op.person },
      { label: "Telepon", render: (u) => Op.esc(u.phone || "-") },
      { label: "Alamat", render: (u) => `<span class="op-clip" title="${Op.esc(u.address || "")}">${Op.esc(u.address || "-")}</span>` },
      { label: "Pesanan", render: (u) => `${u.order_count} · ${Op.idr(u.total_spent)}` },
      { label: "Status", render: (u) => Op.statusBadge(u.status) + " " + Op.onlineDot(u.online) }
    ],
    rowActions: (u) => Op.btn("detail", "fa-eye", "Lihat detail"),
    actions: { detail: (u) => Op.showUser(u.id) } });
}
</script>
</body>
</html>
