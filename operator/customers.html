
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Data Pelanggan — Operator Nusa East</title>
<link rel="icon" type="image/png" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/operator.css">
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
<script defer src="../js/icons.js"></script>
</head>
<body class="admin-body operator-body">
<div class="admin-app" id="adminApp">
  <main class="admin-main">
    <div class="admin-content">
      <div class="a-page-head">
        <div>
          <span class="eyebrow">Pelanggan</span>
          <h1 style="font-size:clamp(1.7rem,3.2vw,2.4rem);">Data Pelanggan</h1>
          <p>Data pelanggan yang tersimpan pada database Nusa East.</p>
        </div>
      </div>
      <div id="tbl"></div>
    </div>
  </main>
</div>

<script src="../js/operator-config.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/operator.js"></script>
<script>
if (Admin.init("customers")) {

  const customerFields = (u={}) => `<div class="form-group"><label>Nama</label><input class="form-control" name="name" required value="${Op.esc(u.name||"")}"></div>
    <div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" required value="${Op.esc(u.email||"")}"></div>
    <div class="form-group"><label>Telepon</label><input class="form-control" name="phone" value="${Op.esc(u.phone||"")}"></div>
    <div class="form-group"><label>Alamat</label><textarea class="form-control" name="address">${Op.esc(u.address||"")}</textarea></div>`;

  async function customerForm(u=null) {
    Admin.openModal({
      title: "Edit Pelanggan",
      body: customerFields(u || {}),
      onSubmit: async(f,ctx) => {
        const data = {
          name: f.name.value,
          email: f.email.value,
          phone: f.phone.value,
          address: f.address.value
        };

        await Admin.api.put("/operator/customers/"+u.id,data);
        ctx.close();
        Admin.toast("Data pelanggan diperbarui.");
        location.reload();
      }
    });
  }

  function deleteCustomer(u) {
    Admin.confirmDialog({
      title:"Hapus pelanggan?",
      message:`Hapus akun <b>${Op.esc(u.name)}</b>? Pelanggan dengan riwayat pesanan tidak dapat dihapus.`,
      confirmLabel:"Hapus",
      onConfirm:async()=>{
        try {
          await Admin.api.del("/operator/customers/"+u.id);
          Admin.toast("Pelanggan dihapus.");
          location.reload();
        } catch(e) {
          Admin.toast(e.message);
        }
      }
    });
  }

  Op.table({
    mount: "#tbl",
    endpoint: "/operator/customers",
    searchPlaceholder: "Cari nama, email, telepon, alamat…",
    filters: [
      {
        name: "status",
        label: "Status akun",
        options: [
          ["","Semua status akun"],
          ["active","Aktif"],
          ["disabled","Nonaktif"],
          ["blocked","Diblokir"]
        ]
      }
    ],
    columns: [
      { label: "Pelanggan", render: Op.person },
      { label: "Telepon", render: (u) => Op.esc(u.phone || "-") },
      {
        label: "Alamat",
        render: (u) => `<span class="op-clip" title="${Op.esc(u.address || "")}">${Op.esc(u.address || "-")}</span>`
      },
      { label: "Pesanan", render: (u) => `${u.order_count} · ${Op.idr(u.total_spent)}` },
      { label: "Status", render: (u) => Op.statusBadge(u.status) }
    ],
    rowActions: (u) =>
      Op.btn("detail", "fa-eye", "Lihat detail") +
      Op.btn("edit", "fa-pen", "Edit pelanggan") +
      Op.btn("delete", "fa-trash", "Hapus pelanggan"),
    actions: {
      detail: (u) => Op.showUser(u.id),
      edit: (u) => customerForm(u),
      delete: (u) => deleteCustomer(u)
    }
  });
}
</script>
</body>
</html>
