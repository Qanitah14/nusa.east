<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Pengelolaan Konten — Nusa East</title>
  <link rel="icon" href="../img/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/operator.css">
  <link rel="stylesheet" href="../css/content-management.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script defer src="../js/icons.js"></script>
</head>
<body class="admin-body operator-body content-management-page">
  <div class="admin-app" id="adminApp">
    <main class="admin-main">
      <div class="admin-content content-management-content">
        <header class="content-page-heading">
          <div>
            <span class="content-eyebrow">WEBSITE NUSA EAST</span>
            <h1>Pengelolaan Konten</h1>
            <p>Kelola artikel, halaman legal, Hero Section, dan Tentang Kami melalui dashboard operator.</p>
          </div>
        </header>

        <section class="content-toolbar" aria-label="Kontrol pengelolaan konten">
          <div class="content-toolbar-select">
            <label for="kind">Kategori konten</label>
            <select id="kind" class="form-control">
              <option value="articles">Manajemen Artikel</option>
              <option value="terms_and_conditions">Syarat dan Ketentuan</option>
              <option value="privacy_policies">Kebijakan Privasi</option>
              <option value="hero_sections">Hero Section</option>
              <option value="about_sections">About / Tentang Kami</option>
            </select>
          </div>
          <div class="content-toolbar-actions">
            <button class="btn btn-primary" id="add" type="button">
              <i class="fa-solid fa-plus" aria-hidden="true"></i><span>Tambah Konten</span>
            </button>
            <button class="btn btn-outline content-reload-btn" id="reload" type="button" aria-label="Muat ulang konten" title="Muat ulang">
              <i class="fa-solid fa-rotate-right" aria-hidden="true"></i><span>Muat Ulang</span>
            </button>
          </div>
        </section>

        <div id="notice" class="form-error content-notice" role="alert" hidden></div>
        <section id="editor" class="a-card content-editor" aria-live="polite" hidden></section>
        <section id="items" class="content-items" aria-live="polite">
          <div class="content-loading"><i class="fa-solid fa-spinner fa-spin"></i> Memuat konten...</div>
        </section>
      </div>
    </main>
  </div>

  <script src="../js/operator-config.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    const queryKind = new URLSearchParams(location.search).get("kind") || "articles";
    const activeKey = ({articles:"articles",terms_and_conditions:"terms",privacy_policies:"privacy",hero_sections:"hero",about_sections:"about"})[queryKind] || "articles";

    if (Admin.init(activeKey)) {
      const $ = s => document.querySelector(s);
      const esc = Admin.esc;
      const kind = $("#kind"), editor = $("#editor"), items = $("#items"), notice = $("#notice");
      let records = [];
      kind.value = queryKind;

      const labels = {
        articles:"Artikel",
        terms_and_conditions:"Syarat dan Ketentuan",
        privacy_policies:"Kebijakan Privasi",
        hero_sections:"Hero Section",
        about_sections:"About / Tentang Kami"
      };
      const fields = {
        articles:[["title","Judul","text"],["slug","Slug","text"],["author","Penulis","text"],["content","Isi Artikel","textarea"],["image","Path Gambar","text"],["is_published","Terbitkan","checkbox"]],
        terms_and_conditions:[["title","Judul","text"],["slug","Slug","text"],["author","Penulis","text"],["content","Isi Syarat dan Ketentuan","textarea"]],
        privacy_policies:[["title","Judul","text"],["slug","Slug","text"],["author","Penulis","text"],["content","Isi Kebijakan Privasi","textarea"]],
        hero_sections:[["title","Judul","text"],["subtitle","Subjudul","textarea"],["image","Path Gambar","text"],["button_text","Teks Tombol","text"],["button_link","Link Tombol","text"],["is_active","Aktifkan","checkbox"]],
        about_sections:[["title","Judul","text"],["subtitle","Subjudul","textarea"],["content","Deskripsi","textarea"],["image","Path Gambar","text"],["vision","Visi","textarea"],["mission","Misi","textarea"]]
      };

      async function load() {
        notice.hidden = true;
        items.innerHTML = '<div class="content-loading"><i class="fa-solid fa-spinner fa-spin"></i> Memuat konten...</div>';
        try {
          records = await Admin.api.get("/content/" + kind.value);
          render();
        } catch (e) {
          showError(e.message);
          items.innerHTML = '<div class="content-load-error"><i class="fa-solid fa-triangle-exclamation"></i><b>Konten gagal dimuat</b><span>Periksa koneksi, lalu coba muat ulang.</span></div>';
        }
      }

      function render() {
        const count = records.length;
        if (!count) {
          items.innerHTML = `
            <div class="content-list-card">
              <div class="content-list-heading">
                <div><h2>Daftar ${labels[kind.value]}</h2><p>Konten yang tersimpan akan ditampilkan di bagian ini.</p></div>
                <span class="content-count">0 konten</span>
              </div>
              <div class="content-empty-state">
                <div class="content-empty-icon"><i class="fa-regular fa-file-lines"></i></div>
                <h3>Belum Ada Konten</h3>
                <p>Mulai tambahkan ${labels[kind.value].toLowerCase()} agar informasi dapat dikelola dan ditampilkan pada website Nusa East.</p>
                <button class="btn btn-primary" type="button" id="emptyAdd"><i class="fa-solid fa-plus"></i><span>Tambah Konten Pertama</span></button>
              </div>
            </div>`;
          return;
        }

        items.innerHTML = `
          <div class="content-list-card">
            <div class="content-list-heading">
              <div><h2>Daftar ${labels[kind.value]}</h2><p>Kelola konten yang sudah tersimpan di website.</p></div>
              <span class="content-count">${count} konten</span>
            </div>
            <div class="a-table-wrap content-table-wrap">
              <table class="a-table content-table">
                <thead><tr><th>Judul</th><th>Slug / Penulis</th><th>Status</th><th class="content-action-heading">Aksi</th></tr></thead>
                <tbody>${records.map(r => {
                  const inactive = r.is_published === false || r.is_active === false;
                  return `<tr>
                    <td data-label="Judul"><b>${esc(r.title || "(tanpa judul)")}</b></td>
                    <td data-label="Slug / Penulis"><span class="content-secondary">${esc(r.slug || r.author || "-")}</span></td>
                    <td data-label="Status"><span class="content-status ${inactive ? "is-draft" : "is-active"}"><i class="fa-solid ${inactive ? "fa-circle-minus" : "fa-circle-check"}"></i>${inactive ? "Draft / Nonaktif" : "Aktif / Terbit"}</span></td>
                    <td data-label="Aksi"><div class="content-row-actions"><button class="btn btn-outline btn-sm" type="button" data-edit="${esc(r.id)}"><i class="fa-regular fa-pen-to-square"></i> Edit</button><button class="btn btn-outline btn-sm content-delete-btn" type="button" data-del="${esc(r.id)}"><i class="fa-regular fa-trash-can"></i> Hapus</button></div></td>
                  </tr>`;
                }).join("")}</tbody>
              </table>
            </div>
          </div>`;
      }

      function showError(msg) {
        notice.textContent = msg;
        notice.hidden = false;
        Admin.toast(msg);
      }

      function openForm(record = {}) {
        const defs = fields[kind.value];
        editor.hidden = false;
        editor.innerHTML = `
          <div class="content-editor-heading"><div><span class="content-eyebrow">FORMULIR KONTEN</span><h2>${record.id ? "Edit" : "Tambah"} ${labels[kind.value]}</h2><p>Lengkapi informasi berikut, lalu simpan perubahan.</p></div><button class="content-close-btn" type="button" id="cancelTop" aria-label="Tutup formulir"><i class="fa-solid fa-xmark"></i></button></div>
          <form id="contentForm" class="content-form">
            <div class="content-form-grid">${defs.map(([name,label,type]) => `<div class="form-group ${type === "textarea" ? "content-field-wide" : ""} ${type === "checkbox" ? "content-checkbox-field" : ""}>${type === "checkbox" ? "" : `<label for="field-${name}">${label}</label>`}${type === "textarea" ? `<textarea class="form-control" id="field-${name}" name="${name}" rows="6">${esc(record[name] ?? "")}</textarea>` : type === "checkbox" ? `<label class="content-check-label"><input id="field-${name}" type="checkbox" name="${name}" ${record[name] ? "checked" : ""}><span>${label}</span></label>` : `<input class="form-control" id="field-${name}" name="${name}" value="${esc(record[name] ?? "")}" ${name === "slug" ? 'placeholder="Dibuat otomatis dari judul jika kosong"' : ""}>`}</div>`).join("")}</div>
            <div class="form-group content-upload-field"><label for="imageFile">Unggah gambar <span>(maks. 5 MB)</span></label><input class="form-control" type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif"><img id="imagePreview" src="${record.image ? Admin.assetUrl(record.image) : ""}" alt="Preview gambar" style="display:${record.image ? "block" : "none"}"></div>
            <div class="content-form-actions"><button class="btn btn-primary" type="submit"><i class="fa-regular fa-floppy-disk"></i> Simpan Konten</button><button class="btn btn-outline" type="button" id="cancel">Batal</button></div>
          </form>`;
        editor.scrollIntoView({behavior:"smooth", block:"start"});
        const closeForm = () => { editor.hidden = true; };
        $("#cancel").onclick = closeForm;
        $("#cancelTop").onclick = closeForm;
        $("#imageFile").onchange = ev => {
          const f = ev.target.files[0], p = $("#imagePreview");
          if (f) { p.src = URL.createObjectURL(f); p.style.display = "block"; }
        };
        $("#contentForm").onsubmit = async ev => {
          ev.preventDefault();
          const form = ev.currentTarget, data = {};
          for (const [n] of defs) {
            const el = form.elements[n];
            data[n] = el.type === "checkbox" ? el.checked : el.value;
          }
          try {
            const file = $("#imageFile").files[0];
            if (file) {
              const fd = new FormData();
              fd.append("image", file);
              const uploaded = await Admin.api.post("/content/upload", fd);
              data.image = uploaded.image;
            }
            if (record.id) await Admin.api.put(`/content/${kind.value}/${record.id}`, data);
            else await Admin.api.post(`/content/${kind.value}`, data);
            Admin.toast("Konten berhasil disimpan.");
            editor.hidden = true;
            await load();
          } catch (e) { showError(e.message); }
        };
      }

      $("#add").onclick = () => openForm();
      $("#reload").onclick = load;
      kind.onchange = () => { location.href = "content.html?kind=" + encodeURIComponent(kind.value); };

      items.onclick = async ev => {
        if (ev.target.closest("#emptyAdd")) { openForm(); return; }
        const button = ev.target.closest("[data-edit],[data-del]");
        if (!button) return;
        const record = records.find(x => String(x.id) === String(button.dataset.edit || button.dataset.del));
        if (!record) return;
        if (button.dataset.edit) openForm(record);
        else Admin.confirmDialog({
          title:"Hapus konten?",
          message:"Konten yang dihapus tidak dapat dipulihkan.",
          confirmLabel:"Hapus",
          onConfirm:async () => {
            try {
              await Admin.api.del(`/content/${kind.value}/${record.id}`);
              Admin.toast("Konten dihapus.");
              await load();
            } catch (err) { showError(err.message); }
          }
        });
      };
      load();
    }
  </script>
</body>
</html>
