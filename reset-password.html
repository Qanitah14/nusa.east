<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Password Baru — Nusa East</title>
<meta name="description" content="Nusa East membantu brand handmade, fashion, dan produk lokal membangun media sosial, konten visual, dan toko digital yang lebih profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/icons.js"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-24">
      <img src="img/logo (2).png" alt="Logo Nusa East" class="auth-logo" onerror="this.style.display='none'">
      <h2>Buat Password Baru</h2>
      <p class="mt-8">Gunakan tautan yang diberikan operator Nusa East. Tautan berlaku sekali dan memiliki batas waktu.</p>
    </div>
    <div class="form-error" id="resetError" role="alert" hidden></div>
    <div id="resetOk" role="status" hidden style="background:#DCEAE0;color:#3A7A4E;padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:.92rem;"></div>
    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="rpPw">Password baru</label>
        <input type="password" class="form-control" id="rpPw" name="password" autocomplete="new-password" minlength="8" required>
        <p class="hint">Minimal 8 karakter.</p>
      </div>
      <div class="form-group">
        <label for="rpPw2">Ulangi password baru</label>
        <input type="password" class="form-control" id="rpPw2" name="password2" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary-regis btn-block">Simpan Password</button>
    </form>
    <p class="auth-switch"><a href="login.html">Kembali ke halaman masuk</a></p>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/validators.js"></script>
<script src="js/auth.js"></script>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  // Token dihapus dari address bar agar tidak tersimpan di riwayat/di-screenshot.
  if (token) history.replaceState(null, "", location.pathname);
  const err = document.getElementById("resetError"), ok = document.getElementById("resetOk");
  if (!/^[a-f0-9]{64}$/.test(token)) {
    err.textContent = "Tautan reset tidak valid. Minta tautan baru melalui halaman Lupa Password."; err.hidden = false;
    document.getElementById("resetForm").hidden = true;
  }
  document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target).entries());
    err.hidden = ok.hidden = true;
    const problem = NEValidate.password(d.password) || (d.password !== d.password2 ? "Konfirmasi password tidak sama." : "");
    if (problem) { err.textContent = problem; err.hidden = false; return; }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "Menyimpan…";
    try {
      const r = await nusaeastResetPassword(token, d.password);
      ok.textContent = r.message; ok.hidden = false; e.target.hidden = true;
      setTimeout(() => { location.href = "login.html"; }, 2500);
    } catch (error) { err.textContent = error.message || "Gagal menyimpan password."; err.hidden = false; btn.disabled = false; btn.textContent = "Simpan Password"; }
  });
</script>
</body>
</html>
