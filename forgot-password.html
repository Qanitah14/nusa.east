<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password — Nusa East</title>
<meta name="description" content="Nusa East membantu brand handmade, fashion, dan produk lokal membangun media sosial, konten visual, dan toko digital yang lebih profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/icons.js"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-24">
      <img src="img/logo (2).png" alt="Logo Nusa East" class="auth-logo" onerror="this.style.display='none'">
      <h2>Lupa Password</h2>
      <p class="mt-8">Masukkan email dan nomor telepon yang terdaftar. Permintaan akan diteruskan ke operator Nusa East, yang akan memberikan tautan untuk membuat password baru.</p>
    </div>
    <div class="form-error" id="forgotError" role="alert" hidden></div>
    <div class="form-success" id="forgotOk" role="status" hidden style="background:#DCEAE0;color:#3A7A4E;padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:.92rem;"></div>
    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="fpEmail">Email</label>
        <input type="email" class="form-control" id="fpEmail" name="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="fpPhone">Nomor telepon terdaftar</label>
        <input type="tel" class="form-control" id="fpPhone" name="phone" required>
        <p class="hint" id="fpPhoneHint">Hanya angka, 9–15 digit. Dipakai untuk memverifikasi identitas Anda.</p>
      </div>
      <button type="submit" class="btn btn-primary-regis btn-block">Kirim Permintaan</button>
    </form>
    <p class="auth-switch">Ingat password? <a href="login.html">Kembali masuk</a></p>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/validators.js"></script>
<script src="js/auth.js"></script>
<script>
  NEValidate.bindPhoneInput(document.getElementById("fpPhone"), document.getElementById("fpPhoneHint"));
  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target).entries());
    const err = document.getElementById("forgotError"), ok = document.getElementById("forgotOk");
    err.hidden = ok.hidden = true;
    const problem = NEValidate.email(d.email) || NEValidate.phone(d.phone);
    if (problem) { err.textContent = problem; err.hidden = false; return; }
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = "Mengirim…";
    try {
      const r = await nusaeastForgotPassword(d.email, d.phone);
      ok.textContent = r.message; ok.hidden = false; e.target.reset();
    } catch (error) { err.textContent = error.message || "Permintaan gagal. Coba lagi."; err.hidden = false; }
    finally { btn.disabled = false; btn.textContent = "Kirim Permintaan"; }
  });
</script>
</body>
</html>
