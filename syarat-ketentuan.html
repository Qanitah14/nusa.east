
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Syarat dan Ketentuan — Nusa East</title>

    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/icons.js"></script>
</head>

<body>

    <main class="section">

        <div class="container" style="max-width: 900px">

            <!-- Tombol kembali -->
            <a href="index.html">
                ← Kembali ke Beranda
            </a>

            <!-- Label halaman -->
            <span
                class="eyebrow"
                style="display: block; margin-top: 24px"
            >
                Informasi
            </span>

            <!-- Judul halaman -->
            <h1 id="legalTitle">
                Syarat dan Ketentuan
            </h1>

            <!-- Gambar konten -->
<div id="legalImageContainer" style="display:none; margin-top:24px;">
    <img
        id="legalImage"
        src=""
        alt="Gambar Syarat dan Ketentuan Nusa East"
        style="
            width:100%;
            max-height:420px;
            object-fit:cover;
            border-radius:16px;
        "
    >
</div>


            <!-- Nama penulis -->
            <p
                id="legalAuthor"
                class="mt-16"
                style="color: #536273; font-size: .95rem"
            ></p>

            <!-- Tanggal pembaruan -->
            <p id="legalUpdated" class="mt-8"></p>

            <!-- Isi konten -->
            <div
                id="legalContent"
                class="mt-40"
                style="white-space: pre-wrap; line-height: 1.8"
            >
                Memuat konten...
            </div>

        </div>

    </main>

    <!-- Mengambil data dari API PostgreSQL -->
    <script>

        (async () => {

            try {

                // Mengambil data Syarat dan Ketentuan
                const r = await fetch(
                    "https://nusa-east-vsxf.vercel.app/api/content/public/legal/terms"
                );

                if (!r.ok) {
                    throw new Error("Gagal mengambil data");
                }

                const d = await r.json();

                if (d) {

                    // Menampilkan judul
                    document.getElementById("legalTitle").textContent =
                        d.title || "Syarat dan Ketentuan";

                        // Menampilkan gambar konten
const imageContainer = document.getElementById("legalImageContainer");
const legalImage = document.getElementById("legalImage");

if (d.image) {
    legalImage.src = d.image.startsWith("http")
        ? d.image
        : "https://nusa-east-vsxf.vercel.app" + d.image;

    imageContainer.style.display = "block";
} else {
    imageContainer.style.display = "none";
}

                    // Menampilkan isi konten
                    document.getElementById("legalContent").textContent =
                        d.content || "";

                    // Menampilkan nama penulis
                    document.getElementById("legalAuthor").textContent =
                        d.author && d.author.trim()
                            ? "Penulis: " + d.author
                            : "Penulis: Nusa East";

                    // Menampilkan tanggal pembaruan
                    document.getElementById("legalUpdated").textContent =
                        "Diperbarui: " +
                        (
                            d.updated_at
                                ? new Date(d.updated_at).toLocaleDateString("id-ID")
                                : "-"
                        );

                } else {

                    document.getElementById("legalContent").textContent =
                        "Konten belum tersedia.";

                }

            } catch (e) {

                // Menampilkan pesan jika API gagal
                document.getElementById("legalContent").textContent =
                    "Konten belum dapat dimuat. Silakan coba kembali.";

            }

        })();

    </script>

</body>
</html>
