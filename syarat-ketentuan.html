<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Syarat dan Ketentuan — Nusa East</title><link rel="icon" href="img/logo.png"><link rel="stylesheet" href="css/style.css"><script defer src="js/icons.js"></script></head><body><main class="section"><div class="container" style="max-width:900px"><a href="index.html">← Kembali ke Beranda</a><span class="eyebrow" style="display:block;margin-top:24px">Informasi</span><h1 id="legalTitle">Syarat dan Ketentuan</h1><p id="legalUpdated" class="mt-16"></p><div id="legalContent" class="mt-40" style="white-space:pre-wrap;line-height:1.8">Memuat konten...</div></div></main><script>
