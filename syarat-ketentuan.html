
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Syarat dan Ketentuan — Nusa East</title>

    <link rel="icon" type="image/png" href="img/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/icons.js"></script>
</head>

<body>

    <!-- ================= HEADER NUSA EAST ================= -->

    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/layout.js"></script>

    <script>
        renderHeader('terms');
    </script>


    <!-- ================= SYARAT DAN KETENTUAN ================= -->

    <main class="section">

        <div class="container" style="max-width: 900px">

            <!-- Tombol kembali -->
            <a href="index.html">
                ← Kembali ke Beranda
            </a>

            <!-- Label halaman -->
            <span
                class="eyebrow"
                style="display: block; margin-top: 24px"
            >
                Informasi
            </span>

            <!-- Judul halaman -->
            <h1 id="legalTitle">
                Syarat dan Ketentuan
            </h1>

            <!-- Gambar konten -->
            <div
                id="legalImageContainer"
                style="display: none; margin-top: 24px"
            >
                <img
                    id="legalImage"
                    src=""
                    alt="Gambar Syarat dan Ketentuan Nusa East"
                    style="
                        width: 100%;
                        max-height: 420px;
                        object-fit: cover;
                        border-radius: 16px;
                    "
                >
            </div>

            <!-- Nama penulis -->
            <p
                id="legalAuthor"
                class="mt-16"
                style="color: #536273; font-size: .95rem"
            ></p>

            <!-- Tanggal pembaruan -->
            <p id="legalUpdated" class="mt-8"></p>

            <!-- Isi konten -->
            <div
                id="legalContent"
                class="mt-40"
                style="white-space: pre-wrap; line-height: 1.8"
            >
                Memuat konten...
            </div>

        </div>

    </main>


    <!-- ================= FOOTER NUSA EAST ================= -->

    <script>
        renderFooter();
    </script>


    <!-- ================= MENGAMBIL DATA DARI API ================= -->

    <script>

        (async () => {

            try {

                // Mengambil data Syarat dan Ketentuan
                const response = await fetch(
                    "https://nusa-east-vsxf.vercel.app/api/content/public/legal/terms"
                );

                if (!response.ok) {
                    throw new Error("Gagal mengambil data");
                }

                const data = await response.json();

                if (data) {

                    // Menampilkan judul
                    document.getElementById("legalTitle").textContent =
                        data.title || "Syarat dan Ketentuan";

                    // Menampilkan gambar konten
                    const imageContainer =
                        document.getElementById("legalImageContainer");

                    const legalImage =
                        document.getElementById("legalImage");

                    if (data.image) {

                        legalImage.src = /^https?:\/\//i.test(data.image)
                            ? data.image
                            : "https://nusa-east-vsxf.vercel.app" + data.image;

                        imageContainer.style.display = "block";

                    } else {

                        imageContainer.style.display = "none";

                    }

                    // Menampilkan isi konten
                    document.getElementById("legalContent").textContent =
                        data.content || "";

                    // Menampilkan nama penulis
                    document.getElementById("legalAuthor").textContent =
                        data.author && data.author.trim()
                            ? "Penulis: " + data.author
                            : "Penulis: Nusa East";

                    // Menampilkan tanggal pembaruan
                    document.getElementById("legalUpdated").textContent =
                        "Diperbarui: " +
                        (
                            data.updated_at
                                ? new Date(data.updated_at).toLocaleDateString("id-ID")
                                : "-"
                        );

                } else {

                    document.getElementById("legalContent").textContent =
                        "Konten belum tersedia.";

                }

            } catch (error) {

                console.error("Gagal memuat Syarat dan Ketentuan:", error);

                document.getElementById("legalContent").textContent =
                    "Konten belum dapat dimuat. Silakan coba kembali.";

            }

        })();

    </script>

</body>
</html>
