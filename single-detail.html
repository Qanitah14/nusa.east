<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Detail Layanan Satuan — Nusa East</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/single-products.css"><script defer src="js/icons.js"></script>
</head>
<body><main class="single-detail-page"><section class="section"><div class="container"><a href="singles.html" class="detail-back">← Kembali ke Layanan Satuan</a><div id="detailRoot"><p>Memuat detail produk…</p></div></div></section></main>
<script src="js/data.js"></script><script src="js/cart.js"></script><script src="js/layout.js"></script><script>
renderHeader('services'); renderFooter();
const API=(window.NUSAEAST_API_BASE||"https://nusa-east-vsxf.vercel.app/api").replace(/\/$/,"");
const root=document.getElementById('detailRoot'); const id=new URLSearchParams(location.search).get('id');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imageFor=item=>item.image||NUSAEAST_DATA.singles.find(x=>x.id===item.id)?.image||'images/service-content.jpg';
const money=n=>formatIDR(Number(n)||0);
let allSingles=NUSAEAST_DATA.singles.map(s=>({...s,image:s.image||'images/service-content.jpg'})); let allServices=NUSAEAST_DATA.services;
function stars(n){return '★'.repeat(Math.max(0,Math.min(5,Math.round(n))))+'☆'.repeat(5-Math.max(0,Math.min(5,Math.round(n))))}
function render(item, reviewData={average:0,count:0,reviews:[]}){
 const service=allServices.find(s=>s.id===item.service); const recs=allSingles.filter(s=>s.id!==item.id).sort((a,b)=>(a.service===item.service?0:1)-(b.service===item.service?0:1)).slice(0,4);
 root.innerHTML=`<div class="single-detail-grid"><div class="single-detail-media"><img src="${esc(imageFor(item))}" alt="Foto ${esc(item.name)}" onerror="this.onerror=null;this.src='images/service-content.jpg'"></div><div class="single-detail-info"><span class="eyebrow">LAYANAN SATUAN</span><p class="detail-category">${esc(service?.name||'Nusa East')}</p><h1>${esc(item.name)}</h1><div class="detail-rating"><span>${stars(reviewData.average)}</span><b>${reviewData.average?Number(reviewData.average).toFixed(1):'Belum ada rating'}</b><a href="#reviews">(${reviewData.count||0} ulasan)</a></div><div class="detail-price">${money(item.price)}</div><p class="detail-unit">Satuan: ${esc(item.unit||'sesuai kebutuhan')}</p><p class="detail-description">${esc(item.description||`Layanan ${item.name} dari Nusa East untuk membantu kebutuhan digital brand dan UMKM.`)}</p><div class="detail-actions"><button class="btn btn-primary" id="addDetailCart">+ Tambah ke Keranjang</button><a class="btn btn-outline" href="singles.html">Lihat layanan lain</a></div><ul class="detail-benefits"><li>✓ Dikerjakan dengan brief yang jelas</li><li>✓ Cocok untuk UMKM dan brand lokal</li><li>✓ Dapat dikombinasikan dengan layanan lain</li></ul></div></div>
 <section class="detail-section" id="reviews"><div class="detail-section-head"><div><span class="eyebrow">PENGALAMAN PELANGGAN</span><h2>Rating & Komentar</h2></div><div class="review-summary"><strong>${reviewData.average?Number(reviewData.average).toFixed(1):'—'}</strong><span>${stars(reviewData.average)}<small>${reviewData.count||0} ulasan</small></span></div></div><div class="review-layout"><div><div id="reviewList">${reviewData.reviews?.length?reviewData.reviews.map(r=>`<article class="review-card"><div class="review-card-top"><b>${esc(r.reviewer_name||'Pelanggan Nusa East')}</b><span>${stars(r.rating)}</span></div><p>${esc(r.comment)}</p><small>${r.created_at?new Date(r.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):''}</small></article>`).join(''):`<div class="review-empty">Belum ada ulasan untuk layanan ini. Jadilah pelanggan pertama yang memberi rating.</div>`}</div></div><form class="review-form" id="reviewForm"><h3>Tulis ulasan</h3><p>Masuk sebagai pengguna terlebih dahulu untuk mengirim rating dan komentar.</p><label for="reviewRating">Rating</label><select id="reviewRating" required><option value="5">★★★★★ — Sangat puas</option><option value="4">★★★★☆ — Puas</option><option value="3">★★★☆☆ — Cukup</option><option value="2">★★☆☆☆ — Kurang</option><option value="1">★☆☆☆☆ — Tidak puas</option></select><label for="reviewComment">Komentar</label><textarea id="reviewComment" rows="4" minlength="3" maxlength="1200" placeholder="Bagikan pengalaman kamu…" required></textarea><button class="btn btn-primary" type="submit">Kirim ulasan</button><p class="review-message" id="reviewMessage" aria-live="polite"></p></form></div></section>
 <section class="detail-section"><div class="detail-section-head"><div><span class="eyebrow">PILIHAN LAIN</span><h2>Rekomendasi layanan</h2></div><a href="singles.html" class="detail-all-link">Lihat semua →</a></div><div class="recommended-grid">${recs.map(r=>`<article class="recommended-card"><a href="single-detail.html?id=${encodeURIComponent(r.id)}"><img src="${esc(imageFor(r))}" alt="Foto ${esc(r.name)}" loading="lazy" onerror="this.onerror=null;this.src='images/service-content.jpg'"></a><div><a class="recommended-title" href="single-detail.html?id=${encodeURIComponent(r.id)}">${esc(r.name)}</a><strong>${money(r.price)}</strong><a class="recommended-link" href="single-detail.html?id=${encodeURIComponent(r.id)}">Lihat detail →</a></div></article>`).join('')}</div></section>`;
 document.getElementById('addDetailCart').addEventListener('click',()=>addToCart({id:item.id,type:'single',name:item.name,price:Number(item.price),qty:1,meta:item.unit||'Layanan satuan'}));
 document.getElementById('reviewForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('reviewMessage');const token=localStorage.getItem('nusaeast_token');if(!token){msg.textContent='Silakan login sebagai pengguna terlebih dahulu.';return;}const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;msg.textContent='Mengirim ulasan…';try{const response=await fetch(`${API}/services/singles/${encodeURIComponent(item.id)}/reviews`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({rating:Number(document.getElementById('reviewRating').value),comment:document.getElementById('reviewComment').value.trim()})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`Gagal mengirim ulasan (HTTP ${response.status})`);msg.textContent='Ulasan berhasil dikirim.';await load();}catch(err){msg.textContent=err.message;}finally{btn.disabled=false;}});
}
async function load(){const fallback=allSingles.find(x=>x.id===id);if(!fallback){root.innerHTML='<div class="review-empty">Produk tidak ditemukan. <a href="singles.html">Kembali ke katalog</a></div>';return;}let item=fallback;let reviewData={average:0,count:0,reviews:[]};try{const [catalogRes,reviewsRes]=await Promise.all([fetch(`${API}/services/catalog`),fetch(`${API}/services/singles/${encodeURIComponent(id)}/reviews`)]);if(catalogRes.ok){const c=await catalogRes.json();if(c.services?.length)allServices=c.services;if(c.singles?.length){allSingles=c.singles.map(s=>({...s,image:s.image||NUSAEAST_DATA.singles.find(x=>x.id===s.id)?.image||'images/service-content.jpg'}));item=allSingles.find(x=>x.id===id)||fallback;}}if(reviewsRes.ok)reviewData=await reviewsRes.json();}catch(_){}render(item,reviewData);}
load();
</script></body></html>
