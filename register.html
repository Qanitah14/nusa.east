<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Nusa East</title>
<meta name="description" content="Nusa East membantu brand handmade, fashion, dan produk lokal membangun media sosial, konten visual, dan toko digital yang lebih profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/icons.js"></script>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-24">    
      <img
        src="img/logo (2).png"
        alt="Logo Nusa East"
        class="auth-logo"
        onerror="this.style.display='none'"
      >
      <h2>Buat Akun Baru</h2>
      <p class="mt-8">Daftar untuk mulai memesan layanan Nusa East.</p>
    </div>
    <div class="form-error" id="registerError" role="alert" hidden></div>
    <form id="registerForm">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" class="form-control" name="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" name="email" required>
      </div>
      <div class="form-group">
        <label for="regPhone">No. WhatsApp / Telepon</label>
        <input type="tel" class="form-control" id="regPhone" name="phone" placeholder="08123456789" required>
        <p class="hint" id="regPhoneHint">Hanya angka, 9–15 digit (tanpa spasi atau tanda +).</p>
      </div>
      <div class="form-group">
        <label for="regAddress">Alamat</label>
        <textarea class="form-control" id="regAddress" name="address" rows="3" maxlength="500" placeholder="Jalan, nomor, kelurahan, kota" required></textarea>
        <p class="hint">Dipakai untuk keperluan pemrosesan pesanan.</p>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" name="password" required minlength="8">
        <p class="hint">Minimal 8 karakter.</p>
      </div>
      <button type="submit" class="btn btn-primary-regis btn-block">Daftar</button>
    </form>
    <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/layout.js"></script>
<script src="js/validators.js"></script>
<script src="js/auth.js"></script>
<script>
  NEValidate.bindPhoneInput(document.getElementById("regPhone"), document.getElementById("regPhoneHint"));
  document.getElementById("registerForm").addEventListener("submit", async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    const errorBox = document.getElementById("registerError");
    const submit = e.target.querySelector('button[type="submit"]');
    errorBox.hidden = true; errorBox.textContent = "";
    const problem = NEValidate.name(data.name) || NEValidate.email(data.email) || NEValidate.phone(data.phone)
      || NEValidate.address(data.address) || NEValidate.password(data.password);
    if (problem) { errorBox.textContent = problem; errorBox.hidden = false; return; }
    submit.disabled = true; submit.textContent = "Mendaftarkan…";
    try { await nusaeastRegister(data); }
    catch (error) { errorBox.textContent = error.message || "Pendaftaran gagal. Silakan coba lagi."; errorBox.hidden = false; }
    finally { submit.disabled = false; submit.textContent = "Daftar"; }
  });
</script>
</body>
</html>
