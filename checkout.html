<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Nusa East</title>
<meta name="description" content="Nusa East membantu brand handmade, fashion, dan produk lokal membangun media sosial, konten visual, dan toko digital yang lebih profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/icons.js"></script>
</head>
<body>


<section class="page-hero checkout-hero">
  <div class="container">
    <div class="checkout-hero-content">
      <div class="checkout-hero-title">
        <span class="eyebrow">LANGKAH 2</span>
        <h1>Pembayaran Pesanan</h1>
      </div>

      <p>
        Selesaikan pembayaran pesananmu dengan memilih metode yang paling nyaman.
        Periksa kembali total biaya, lalu selesaikan pembayaran melalui sistem pembayaran Midtrans.
      </p>
    </div>
  </div>
</section>


<section class="section">
  <div class="container">
    <div class="cart-layout" id="checkoutLayout"></div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/api.js"></script>
<script src="js/orders.js"></script>
<script src="js/layout.js"></script>
<script>
  renderHeader('services');
  renderFooter();

  const checkoutItems = getSelectedCart();
  const { cart, breakdown, base, percentExtra, total } = calculateCartTotals(checkoutItems);
  const layout = document.getElementById("checkoutLayout");

  if (cart.length === 0) {
    layout.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <h3>Keranjang kosong</h3>
        <p class="mt-8">Tidak ada item untuk dibayar.</p>
        <a href="packages.html" class="btn btn-primary mt-24">Lihat Paket</a>
      </div>`;
  } else {
    layout.innerHTML = `
      <div>
        <div class="card mb-24">
          <h3 class="mb-16">Pembayaran Aman dengan Midtrans</h3>
          <p>Pilih metode pembayaran yang tersedia pada jendela pembayaran Midtrans. Kamu dapat menggunakan Virtual Account, transfer bank, QRIS, atau e-wallet sesuai metode yang diaktifkan pada akun merchant Nusa East.</p>
          <p class="hint mt-16">Pembayaran akan diverifikasi oleh Midtrans dan status pesanan diperbarui melalui notifikasi backend.</p>
        </div>
      </div>
      <div class="card summary-box">
        <h3 class="mb-16">Ringkasan Pembayaran</h3>
        <div class="summary-row"><span>Subtotal</span><span>${formatIDR(base)}</span></div>
        ${percentExtra > 0 ? `<div class="summary-row"><span>Express/Priority</span><span>${formatIDR(percentExtra)}</span></div>` : ""}
        <div class="summary-row total"><span>Total Bayar</span><span>${formatIDR(total)}</span></div>
        <button class="btn btn-primary btn-block mt-24" id="payBtn">Bayar Sekarang</button>
        <p class="hint mt-16">Dengan klik "Bayar Sekarang", pesanan dibuat dan jendela pembayaran Midtrans akan terbuka. Status pesanan berubah setelah notifikasi pembayaran diverifikasi backend.</p>
      </div>
    `;

    document.getElementById("payBtn").addEventListener("click", async () => {
      const button = document.getElementById("payBtn");
      if (!checkoutItems.length) {
        alert("Pilih item yang ingin dibayar dari keranjang.");
        location.href = "cart.html";
        return;
      }
      if (!localStorage.getItem("nusaeast_token")) {
        alert("Silakan login terlebih dahulu sebelum membuat pesanan.");
        location.href = "login.html";
        return;
      }

      button.disabled = true;
      button.textContent = "Menyiapkan pembayaran...";
      try {
        const payload = {
          items: breakdown.map(item => ({
            id: String(item.id), type: String(item.type || ""),
            name: String(item.name || ""), price: Number(item.price),
            qty: Number(item.qty || 1), lineTotal: Number(item.lineTotal)
          })),
          total: Number(total),
          paymentMethod: "midtrans"
        };
        const orderResult = await apiFetch("/orders", {
          method: "POST", body: JSON.stringify(payload)
        });
        const orderId = orderResult.orderId || orderResult.id;
        if (!orderId) throw new Error("Backend tidak mengembalikan nomor pesanan.");

        const paymentConfig = await apiFetch("/payment/config");
        if (!paymentConfig.clientKey) throw new Error("Client Key Midtrans belum tersedia.");
        const snapScript = document.createElement("script");
        const snapHost = paymentConfig.isProduction
          ? "https://app.midtrans.com/snap/snap.js"
          : "https://app.sandbox.midtrans.com/snap/snap.js";
        snapScript.src = `${snapHost}?client-key=${encodeURIComponent(paymentConfig.clientKey)}`;
        snapScript.async = true;
        await new Promise((resolve, reject) => {
          snapScript.onload = resolve;
          snapScript.onerror = () => reject(new Error("Gagal memuat Snap.js. Periksa koneksi atau Client Key Midtrans."));
          document.head.appendChild(snapScript);
        });

        button.textContent = "Membuka pembayaran...";
        const transaction = await apiFetch("/payment/create", {
          method: "POST", body: JSON.stringify({ orderId })
        });
        if (!transaction.token) throw new Error("Backend tidak mengembalikan Snap Token.");

        const now = new Date().toISOString();
        const localOrders = getOrders().filter(order => order.id !== orderId);
        localOrders.push({
          id: orderId,
          items: breakdown.map(item => ({ ...item, lineTotal: Number(item.lineTotal) })),
          total: Number(total), paymentMethod: "midtrans", paymentStatus: "pending",
          createdAt: now, statusIndex: 0, revisionsUsed: 0,
          log: [{ step: "Pesanan Dibuat", date: now }], brief: null
        });
        saveOrders(localOrders);

        const finishPending = (message) => {
          removeCartItems(checkoutItems.map(item => item.id));
          alert(message);
          location.href = "confirmation.html?order=" + encodeURIComponent(orderId);
        };
        window.snap.pay(transaction.token, {
          onSuccess: function () {
            finishPending("Pembayaran diterima. Status akhir akan diperbarui setelah verifikasi notifikasi Midtrans.");
          },
          onPending: function () {
            finishPending("Pembayaran masih menunggu. Selesaikan pembayaran sesuai instruksi Midtrans.");
          },
          onError: function (result) {
            console.error("Midtrans payment error:", result);
            alert("Pembayaran belum berhasil. Silakan coba kembali atau pilih metode lain di jendela Midtrans.");
            button.disabled = false;
            button.textContent = "Coba Bayar Lagi";
          },
          onClose: function () {
            alert("Jendela pembayaran ditutup. Pesanan tersimpan dengan status menunggu pembayaran.");
            button.disabled = false;
            button.textContent = "Lanjutkan Pembayaran";
          }
        });
      } catch (error) {
        console.error("Gagal memulai pembayaran Midtrans:", error);
        alert(error.message || "Gagal memulai pembayaran. Periksa koneksi backend.");
        button.disabled = false;
        button.textContent = "Bayar Sekarang";
      }
    });
  }
</script>
</body>
</html>
