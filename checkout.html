<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Pesanan — Nusa East</title>
    <link rel="icon" href="img/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout-payment.css">
    <script defer src="js/icons.js"></script>
</head>
<body>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/layout.js"></script>
    <script>renderHeader('services');</script>

    <main class="checkout-page">
        <div class="container checkout-container">
            <div class="checkout-heading">
                <span class="eyebrow">LANGKAH 2</span>
                <h1>Selesaikan Pembayaran</h1>
                <p>Periksa pesananmu sebelum melanjutkan.</p>
            </div>

            <div id="checkoutLayout" class="checkout-layout">
                <div class="checkout-loading">Memuat ringkasan pesanan...</div>
            </div>
        </div>
    </main>

    <script>renderFooter();</script>

    <script>
    (async function () {
        const layout = document.getElementById("checkoutLayout");
        const checkoutItems = getSelectedCart();
        const { cart, breakdown, base, percentExtra, total } =
            calculateCartTotals(checkoutItems);

        if (!cart.length) {
            layout.innerHTML = `
                <section class="checkout-card checkout-empty">
                    <h2>Keranjang kosong</h2>
                    <p>Pilih layanan terlebih dahulu sebelum checkout.</p>
                    <a href="packages.html" class="btn btn-primary">Lihat Paket</a>
                </section>`;
            return;
        }

        if (!localStorage.getItem("nusaeast_token")) {
            location.href = "login.html?redirect=checkout.html";
            return;
        }

        const itemRows = breakdown.map(item => `
            <div class="checkout-item">
                <div>
                    <strong>${escapeHTML(item.name || "Layanan")}</strong>
                    <small>${Number(item.qty || 1)} × ${formatIDR(item.price)}</small>
                </div>
                <strong>${formatIDR(item.lineTotal)}</strong>
            </div>
        `).join("");

        layout.innerHTML = `
            <section class="checkout-card checkout-items-card">
                <div class="checkout-card-heading">
                    <div>
                        <span class="checkout-step">RINGKASAN</span>
                        <h2>Pesananmu</h2>
                    </div>
                    <span class="checkout-secure"><i class="fa-solid fa-lock"></i> Aman</span>
                </div>
                <div class="checkout-items">${itemRows}</div>
                <div class="checkout-payment-info" id="paymentMethodInfo">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Pembayaran diproses secara aman melalui Midtrans.</span>
                </div>
            </section>

            <aside class="checkout-card checkout-summary">
                <h2>Ringkasan Biaya</h2>
                <div class="checkout-summary-row">
                    <span>Subtotal</span><strong>${formatIDR(base)}</strong>
                </div>
                ${percentExtra > 0 ? `
                <div class="checkout-summary-row">
                    <span>Express / Priority</span><strong>${formatIDR(percentExtra)}</strong>
                </div>` : ""}
                <div class="checkout-total">
                    <span>Total Pembayaran</span>
                    <strong>${formatIDR(total)}</strong>
                </div>
                <div class="checkout-methods" role="radiogroup" aria-label="Metode pembayaran">
                    <label class="checkout-method selected" for="methodMidtrans">
                        <input type="radio" name="paymentChoice" id="methodMidtrans" value="midtrans" checked>
                        <span class="checkout-method-copy"><strong>Midtrans</strong><small>QRIS, Virtual Account, e-wallet, dan metode tersedia</small></span>
                    </label>
                    <label class="checkout-method" for="methodManual">
                        <input type="radio" name="paymentChoice" id="methodManual" value="manual_transfer">
                        <span class="checkout-method-copy"><strong>Transfer Rekening BSI</strong><small>Transfer langsung dan unggah bukti pembayaran</small></span>
                    </label>
                </div>
                <div id="manualTransferDetails" class="manual-transfer-details" hidden>
                    <h3>Transfer ke rekening Nusa East</h3>
                    <p class="manual-bank-name">Bank Syariah Indonesia (BSI)</p>
                    <div class="manual-account-row"><span>Nomor rekening</span><strong id="manualAccountNumber">3344241105</strong><button type="button" id="copyAccountBtn" class="btn btn-outline btn-sm">Salin</button></div>
                    <div class="manual-account-row"><span>Atas nama</span><strong>Nailah Nurfadhillah</strong></div>
                    <p class="manual-bank-warning">Transfer sesuai total pembayaran di atas. Setelah transfer, wajib unggah bukti agar dapat diverifikasi.</p>
                    <label class="manual-proof-label" for="manualProof">Bukti transfer (JPG, PNG, WebP · maks. 3 MB)</label>
                    <input type="file" id="manualProof" class="form-control" accept="image/jpeg,image/png,image/webp">
                </div>
                <button id="payBtn" class="btn btn-primary checkout-pay-button">
                    Lanjutkan Pembayaran <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p class="checkout-footnote" id="checkoutFootnote">Status pembayaran akan diperbarui setelah Midtrans mengonfirmasi transaksi.</p>
                <a href="cart.html" class="checkout-back">Kembali ke keranjang</a>
            </aside>`;

        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        function loadSnap(clientKey, isProduction) {
            return new Promise((resolve, reject) => {
                if (window.snap) return resolve();
                const script = document.createElement("script");
                script.src = isProduction
                    ? "https://app.midtrans.com/snap/snap.js"
                    : "https://app.sandbox.midtrans.com/snap/snap.js";
                script.setAttribute("data-client-key", clientKey);
                script.onload = resolve;
                script.onerror = () => reject(new Error("Midtrans gagal dimuat. Periksa koneksi internet."));
                document.head.appendChild(script);
            });
        }

        async function waitForPaid(orderId) {
            for (let attempt = 0; attempt < 30; attempt++) {
                const status = await apiFetch("/payment/order/" + encodeURIComponent(orderId));
                if (status.paymentStatus === "paid") return true;
                if (status.paymentStatus === "failed" || status.paymentStatus === "expired") return false;
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
            return false;
        }

        const payButton = document.getElementById("payBtn");
        let pendingManualOrderId = null;
        const methodRadios = document.querySelectorAll('input[name="paymentChoice"]');
        const manualDetails = document.getElementById("manualTransferDetails");
        const paymentInfo = document.getElementById("paymentMethodInfo");
        const footnote = document.getElementById("checkoutFootnote");
        methodRadios.forEach(radio => radio.addEventListener("change", () => {
            if (!radio.checked) return;
            const manual = radio.value === "manual_transfer";
            document.querySelectorAll(".checkout-method").forEach(el => el.classList.toggle("selected", el.querySelector("input").checked));
            manualDetails.hidden = !manual;
            paymentInfo.innerHTML = manual
                ? '<i class="fa-solid fa-building-columns"></i><span>Transfer bank diverifikasi manual oleh Admin Penjualan.</span>'
                : '<i class="fa-solid fa-shield-halved"></i><span>Pembayaran diproses secara aman melalui Midtrans.</span>';
            footnote.textContent = manual ? "Pesanan diproses setelah bukti transfer diverifikasi Admin Penjualan." : "Status pembayaran diperbarui setelah Midtrans mengonfirmasi transaksi.";
            payButton.innerHTML = manual ? 'Kirim Bukti Transfer <i class="fa-solid fa-arrow-right"></i>' : 'Lanjutkan Pembayaran <i class="fa-solid fa-arrow-right"></i>';
        }));
        document.getElementById("copyAccountBtn").addEventListener("click", async () => {
            try { await navigator.clipboard.writeText("3344241105"); document.getElementById("copyAccountBtn").textContent = "Tersalin"; }
            catch (_) { alert("Nomor rekening: 3344241105"); }
        });

        payButton.addEventListener("click", async () => {
            const selectedMethod = document.querySelector('input[name="paymentChoice"]:checked')?.value || "midtrans";
            const proofInput = document.getElementById("manualProof");
            if (selectedMethod === "manual_transfer" && !proofInput.files.length) {
                alert("Unggah bukti transfer terlebih dahulu."); proofInput.focus(); return;
            }
            if (selectedMethod === "manual_transfer" && proofInput.files[0].size > 3 * 1024 * 1024) {
                alert("Ukuran bukti transfer maksimal 3 MB."); return;
            }
            payButton.disabled = true;
            payButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyiapkan pembayaran...';

            try {
                if (selectedMethod === "midtrans") {
                    const config = await apiFetch("/payment/config");
                    await loadSnap(config.clientKey, config.isProduction === true);
                }

                const orderResult = (selectedMethod === "manual_transfer" && pendingManualOrderId)
                    ? { orderId: pendingManualOrderId }
                    : await apiFetch("/orders", {
                    method: "POST",
                    body: JSON.stringify({
                        items: breakdown.map(item => ({
                            id: String(item.id),
                            type: String(item.type || ""),
                            name: String(item.name || ""),
                            price: Number(item.price),
                            qty: Number(item.qty || 1),
                            lineTotal: Number(item.lineTotal)
                        })),
                        total: Number(total),
                        paymentMethod: selectedMethod === "manual_transfer" ? "manual_transfer" : "va"
                    })
                });

                const orderId = orderResult.orderId || orderResult.id;
                if (!orderId) throw new Error("Nomor pesanan tidak diterima dari server.");
                if (selectedMethod === "manual_transfer") pendingManualOrderId = orderId;

                localStorage.setItem("nusaeast_last_pending_order", orderId);

                if (selectedMethod === "manual_transfer") {
                    const formData = new FormData();
                    formData.append("proof", proofInput.files[0]);
                    const token = localStorage.getItem("nusaeast_token");
                    const uploadResponse = await fetch(`${NUSAEAST_API_BASE}/payment/manual/${encodeURIComponent(orderId)}/proof`, {
                        method: "POST", headers: token ? { Authorization: `Bearer ${token}` } : {}, body: formData
                    });
                    const uploadData = await uploadResponse.json().catch(() => ({}));
                    if (!uploadResponse.ok) throw new Error(uploadData.error || "Bukti transfer gagal dikirim.");
                    removeCartItems(checkoutItems.map(item => item.id));
                    location.href = "waiting-payment.html?order=" + encodeURIComponent(orderId);
                    return;
                }

                const transaction = await apiFetch("/payment/create", {
                    method: "POST",
                    body: JSON.stringify({ orderId })
                });
                if (!transaction.token) throw new Error("Token pembayaran Midtrans tidak tersedia.");

                window.snap.pay(transaction.token, {
                    onSuccess: async function () {
                        payButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi pembayaran...';
                        try {
                            const paid = await waitForPaid(orderId);
                            if (paid) {
                                removeCartItems(checkoutItems.map(item => item.id));
                                location.href = "confirmation.html?order=" + encodeURIComponent(orderId);
                            } else {
                                location.href = "waiting-payment.html?order=" + encodeURIComponent(orderId);
                            }
                        } catch (_) {
                            location.href = "waiting-payment.html?order=" + encodeURIComponent(orderId);
                        }
                    },
                    onPending: function () {
                        location.href = "waiting-payment.html?order=" + encodeURIComponent(orderId);
                    },
                    onError: function (result) {
                        console.error("Midtrans error:", result);
                        alert("Pembayaran belum berhasil diproses. Silakan coba lagi.");
                        payButton.disabled = false;
                        payButton.innerHTML = 'Lanjutkan Pembayaran <i class="fa-solid fa-arrow-right"></i>';
                    },
                    onClose: function () {
                        // Pesanan tetap tersimpan di database dan dapat dibuka dari Profil > Riwayat Pesanan.
                        location.href = "waiting-payment.html?order=" + encodeURIComponent(orderId);
                    }
                });
            } catch (error) {
                console.error("Checkout error:", error);
                alert(error.message || "Tidak dapat memulai pembayaran.");
                payButton.disabled = false;
                payButton.innerHTML = 'Lanjutkan Pembayaran <i class="fa-solid fa-arrow-right"></i>';
            }
        });
    })();
    </script>
</body>
</html>
