<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Nusa East</title>
<meta name="description" content="Nusa East membantu brand handmade, fashion, dan produk lokal membangun media sosial, konten visual, dan toko digital yang lebih profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="page-hero" style="text-align:left; padding-bottom:0;">
  <div class="container">
    <span class="eyebrow">Langkah 2</span>
    <h1>Simulasi Pembayaran</h1>
    <p>Ini adalah simulasi pembayaran untuk keperluan prototype. Untuk produksi, hubungkan ke payment gateway (Midtrans/Xendit) — lihat <code>backend/controllers/paymentGateway.js</code>.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="cart-layout" id="checkoutLayout"></div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/layout.js"></script>
<script>
  renderHeader('services');
  renderFooter();

  const { cart, breakdown, base, percentExtra, total } = calculateCartTotals();
  const layout = document.getElementById("checkoutLayout");

  if (cart.length === 0) {
    layout.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <h3>Keranjang kosong</h3>
        <p class="mt-8">Tidak ada item untuk dibayar.</p>
        <a href="packages.html" class="btn btn-primary mt-24">Lihat Paket</a>
      </div>`;
  } else {
    layout.innerHTML = `
      <div>
        <div class="card mb-24">
          <h3 class="mb-16">Metode Pembayaran</h3>
          <div class="payment-methods" id="paymentMethods">
            <label class="payment-method selected"><input type="radio" name="pm" value="va" checked>🏦 Virtual Account</label>
            <label class="payment-method"><input type="radio" name="pm" value="ewallet">📱 E-Wallet</label>
            <label class="payment-method"><input type="radio" name="pm" value="qris">🔳 QRIS</label>
          </div>
        </div>
        <div class="card" id="paymentDetail"></div>
      </div>
      <div class="card summary-box">
        <h3 class="mb-16">Ringkasan Pembayaran</h3>
        <div class="summary-row"><span>Subtotal</span><span>${formatIDR(base)}</span></div>
        ${percentExtra > 0 ? `<div class="summary-row"><span>Express/Priority</span><span>${formatIDR(percentExtra)}</span></div>` : ""}
        <div class="summary-row total"><span>Total Bayar</span><span>${formatIDR(total)}</span></div>
        <button class="btn btn-primary btn-block mt-24" id="payBtn">Bayar Sekarang</button>
        <p class="hint mt-16">Dengan klik "Bayar Sekarang", pesanan akan dibuat dan kamu lanjut ke pengisian brief project.</p>
      </div>
    `;

    const detailBox = document.getElementById("paymentDetail");
    function renderDetail(method) {
      if (method === "va") {
        detailBox.innerHTML = `
          <h3 class="mb-16">Transfer Virtual Account</h3>
          <div class="va-box">
            <div>
              <div class="line-meta">Bank Nusa Digital (Simulasi)</div>
              <div class="va-number">8807 2026 1029 33</div>
            </div>
            <span class="badge badge-orange">Menunggu Pembayaran</span>
          </div>
          <p class="hint mt-16">Transfer sesuai nominal total secara tepat agar terverifikasi otomatis.</p>
        `;
      } else if (method === "ewallet") {
        detailBox.innerHTML = `
          <h3 class="mb-16">Bayar dengan E-Wallet</h3>
          <div class="grid-3">
            <button class="btn btn-outline btn-block">GoPay</button>
            <button class="btn btn-outline btn-block">OVO</button>
            <button class="btn btn-outline btn-block">DANA</button>
          </div>
          <p class="hint mt-16">Kamu akan diarahkan ke aplikasi e-wallet untuk konfirmasi (simulasi).</p>
        `;
      } else {
        detailBox.innerHTML = `
          <h3 class="mb-16">Scan QRIS</h3>
          <div class="qris-box">
            <img src="images/qris-sample.jpg" alt="QRIS Nusa East">
            <p>Scan menggunakan aplikasi bank / e-wallet apa pun.</p>
          </div>
        `;
      }
    }
    renderDetail("va");

    document.querySelectorAll('input[name="pm"]').forEach(radio => {
      radio.addEventListener("change", () => {
        document.querySelectorAll(".payment-method").forEach(l => l.classList.remove("selected"));
        radio.closest(".payment-method").classList.add("selected");
        renderDetail(radio.value);
      });
    });

    document.getElementById("payBtn").addEventListener("click", () => {
      const method = document.querySelector('input[name="pm"]:checked').value;
      const order = createOrder({ items: breakdown, total, paymentMethod: method });
      clearCart();
      location.href = "confirmation.html?order=" + order.id;
    });
  }
</script>
</body>
</html>
