<!DOCTYPE html>
<html lang="id">
<link rel="icon" type="image/png" href="img/logo.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation — Nusa East</title>
<meta name="description" content="Nusa East membantu brand handmade, fashion, dan produk lokal membangun media sosial, konten visual, dan toko digital yang lebih profesional.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script defer src="js/icons.js"></script>
</head>
<body>

<section class="section">
  <div class="container">
    <div class="form-card text-center" style="max-width:600px; margin:0 auto;" id="confirmBox"></div>
  </div>
</section>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script src="js/layout.js"></script>
<script>
  renderHeader('services');
  renderFooter();

  const params = new URLSearchParams(location.search);
  const orderId = params.get("order");
  const order = orderId ? getOrder(orderId) : null;
  const box = document.getElementById("confirmBox");

  if (!order) {
    box.innerHTML = `<h2>Pesanan tidak ditemukan</h2><a href="packages.html" class="btn btn-primary mt-24">Lihat Paket</a>`;
  } else {
    box.innerHTML = `
      <div style="font-size:3rem;">✅</div>
      <h2 class="mt-16">Pembayaran Berhasil!</h2>
      <p class="mt-8">Nomor Order Kamu</p>
      <div class="va-number" style="font-size:1.4rem; margin:6px 0 20px;">${order.id}</div>
      <div class="summary-row total"><span>Total Dibayar</span><span>${formatIDR(order.total)}</span></div>
      <p class="mt-16">Langkah selanjutnya: lengkapi form brief project supaya tim kami bisa mulai mengerjakan pesananmu.</p>
      <a href="brief.html?order=${order.id}" class="btn btn-primary btn-block mt-24">Isi Brief Project</a>
      <a href="tracking.html?order=${order.id}" class="btn btn-outline btn-block mt-16">Lihat Tracking Project</a>
    `;
  }
</script>
</body>
</html>
