<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Pembayaran — Nusa East</title>
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/icons.js"></script>
</head>
<body>
    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script>renderHeader('services');</script>

    <main class="section">
        <div class="container">
            <div class="form-card text-center" style="max-width:620px;margin:0 auto;" id="confirmBox">
                <p>Memeriksa status pembayaran langsung ke Midtrans...</p>
            </div>
        </div>
    </main>

    <script>renderFooter();</script>

    <script>
    (async function () {
        const params = new URLSearchParams(location.search);
        const orderId = params.get("order") || params.get("order_id");
        const box = document.getElementById("confirmBox");

        function safe(value) {
            return String(value ?? "").replace(/[&<>"']/g, char => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[char]));
        }

        if (!orderId) {
            box.textContent = "Nomor pesanan tidak ditemukan.";
            return;
        }

        try {
            // Endpoint ini melakukan sinkronisasi status ke API Midtrans sebelum mengembalikan status database.
            const payment = await apiFetch("/payment/order/" + encodeURIComponent(orderId));

            if (payment.paymentStatus !== "paid") {
                location.replace("waiting-payment.html?order=" + encodeURIComponent(orderId));
                return;
            }

            const order = await apiFetch("/orders/" + encodeURIComponent(orderId));
            if (order.payment_status !== "paid") {
                location.replace("waiting-payment.html?order=" + encodeURIComponent(orderId));
                return;
            }

            box.innerHTML = `
                <div class="payment-success-icon" role="img" aria-label="Pembayaran berhasil">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <circle class="success-circle" cx="32" cy="32" r="27"></circle>
                        <path class="success-check" d="M18 33 L27 42 L46 23"></path>
                    </svg>
                </div>
                <span class="confirmation-label">PEMBAYARAN TERKONFIRMASI</span>
                <h2 class="confirmation-title">Pembayaran Berhasil!</h2>
                <p class="confirmation-description">Terima kasih. Pembayaranmu telah dikonfirmasi oleh Midtrans dan Nusa East.</p>
                <div class="confirmation-order">
                    <span class="confirmation-order-label">Nomor Pesanan</span>
                    <strong>${safe(order.id)}</strong>
                </div>
                <div class="confirmation-total">
                    <span>Total Dibayar</span>
                    <strong>${new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Number(order.total))}</strong>
                </div>
                <div class="confirmation-actions">
                    <a href="brief.html?order=${encodeURIComponent(order.id)}" class="btn btn-primary">Isi Brief Project →</a>
                    <a href="profile.html" class="btn btn-outline">Riwayat Pesanan</a>
                </div>`;
        } catch (error) {
            console.error("Konfirmasi pembayaran:", error);
            box.innerHTML = `
                <h2>Status pembayaran belum dapat diperiksa</h2>
                <p>${safe(error.message || "Silakan coba kembali beberapa saat lagi.")}</p>
                <a href="waiting-payment.html?order=${encodeURIComponent(orderId)}" class="btn btn-primary mt-24">Periksa Status Pembayaran</a>
                <a href="profile.html" class="btn btn-outline mt-24">Kembali ke Profil</a>`;
        }
    })();
    </script>
</body>
</html>
